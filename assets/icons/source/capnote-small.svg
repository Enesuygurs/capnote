    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#tile)"/>
  <path d="M336 168 H620 L776 324 V800 A72 72 0 0 1 704 872 H336 A72 72 0 0 1 264 800 V240 A72 72 0 0 1 336 168 Z" fill="#FFFFFF"/>
  <path d="M620 168 V268 A56 56 0 0 0 676 324 H776 Z" fill="#FDCB8E"/>
