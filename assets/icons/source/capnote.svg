<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Capnote app icon: a rounded amber square with a white capsule on it, turned 45 degrees: one
       half of the capsule solid, the other its outline. The capsule is drawn in white rather than
       cut out, so it stays white on a dark taskbar too. Simple enough to be sharp at 16px, so every
       size is drawn from it. Rendered to PNG/ICO by scripts/build-icons.mjs. -->
  <rect x="96" y="96" width="832" height="832" rx="224" fill="#F59E0B" />
  <g transform="rotate(-45 512 512)" fill="#FFFFFF">
    <path d="M512 360 H380 A152 152 0 0 0 380 664 H512 Z" />
    <path
      d="M512 384 H644 A128 128 0 0 1 644 640 H512 Z"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="48"
      stroke-linejoin="round"
    />
  </g>
</svg>
