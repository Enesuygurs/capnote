<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Capnote app icon: a capsule in one flat amber, turned 45 degrees. One half is solid with a
       highlight cut out of it, the other is its outline. Simple enough to be sharp at 16px, so
       every size is drawn from it. Rendered to PNG/ICO by scripts/build-icons.mjs. -->
  <defs>
    <mask id="highlight">
      <rect width="1024" height="1024" fill="#FFFFFF" />
      <path
        d="M232 448 A116 116 0 0 1 324 392 H360"
        fill="none"
        stroke="#000000"
        stroke-width="44"
        stroke-linecap="round"
      />
    </mask>
  </defs>
  <g transform="rotate(-45 512 512)">
    <path d="M512 288 H320 A224 224 0 0 0 320 736 H512 Z" fill="#F59E0B" mask="url(#highlight)" />
    <path
      d="M512 320 H704 A192 192 0 0 1 704 704 H512 Z"
      fill="none"
      stroke="#F59E0B"
      stroke-width="64"
      stroke-linejoin="round"
    />
  </g>
</svg>
