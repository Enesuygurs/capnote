<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Capnote app icon: a journal page with a bookmark ribbon on an amber tile.
       The one Capnote icon: the app, the installer, the tray and the app's own pages all use it.
       Rendered to PNG/ICO by scripts/build-icons.mjs. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FCD34D" />
      <stop offset="0.5" stop-color="#F59E0B" />
      <stop offset="1" stop-color="#E8590C" />
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#FFF4E0" />
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FEF3C7" />
      <stop offset="1" stop-color="#FCD34D" />
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EA580C" />
      <stop offset="1" stop-color="#C2410C" />
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#431407" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)" />
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#glow)" />

  <g transform="rotate(-6 512 520)">
    <g filter="url(#lift)">
      <path
        d="M340 196 H612 L756 340 V780 A56 56 0 0 1 700 836 H340 A56 56 0 0 1 284 780 V252 A56 56 0 0 1 340 196 Z"
        fill="url(#page)"
      />
      <path d="M612 196 V292 A48 48 0 0 0 660 340 H756 Z" fill="url(#fold)" />
    </g>

    <!-- Bookmark ribbon hanging from the top edge -->
    <path d="M356 196 H436 V400 L396 366 L356 400 Z" fill="url(#ribbon)" />

    <g fill="#F59E0B">
      <rect x="476" y="440" width="208" height="38" rx="19" />
      <rect x="356" y="528" width="328" height="38" rx="19" opacity="0.5" />
      <rect x="356" y="616" width="328" height="38" rx="19" opacity="0.5" />
      <rect x="356" y="704" width="196" height="38" rx="19" opacity="0.5" />
    </g>
  </g>
</svg>
