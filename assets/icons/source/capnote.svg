<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Capnote app icon: a rounded square in one flat amber with a capsule cut out of it, turned 45
       degrees: one half of the capsule is a solid hole, the other its outline, so what is behind
       shows through. Simple enough to be sharp at 16px, so every size is drawn from it.
       Rendered to PNG/ICO by scripts/build-icons.mjs. -->
  <defs>
    <mask id="capsule">
      <rect width="1024" height="1024" fill="#FFFFFF" />
      <g transform="rotate(-45 512 512)">
        <path d="M512 360 H380 A152 152 0 0 0 380 664 H512 Z" fill="#000000" />
        <path
          d="M512 384 H644 A128 128 0 0 1 644 640 H512 Z"
          fill="none"
          stroke="#000000"
          stroke-width="48"
          stroke-linejoin="round"
        />
      </g>
    </mask>
  </defs>
  <rect x="96" y="96" width="832" height="832" rx="224" fill="#F59E0B" mask="url(#capsule)" />
</svg>
